<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Instant Resume: tailored resumes and cover letters, grounded in your real experience">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2320"/>
      <stop offset="1" stop-color="#0F3B34"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#A8D3C9" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#dots)"/>

  <!-- brand mark -->
  <g transform="translate(80 92)">
    <rect width="76" height="76" rx="18" fill="#0E7466"/>
    <g transform="translate(14 13) scale(2)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
      <path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 11h7M9 15h4"/>
    </g>
  </g>

  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="182" y="132" font-size="48" font-weight="700" fill="#F3F2EE" letter-spacing="-1">Instant Resume</text>
    <text x="182" y="172" font-size="22" fill="#C9DAD5">Tailored resumes and cover letters, grounded in your real experience.</text>

    <g font-size="15" font-weight="600">
      <rect x="182" y="198" width="124" height="32" rx="16" fill="#E2F0EC" opacity=".12" stroke="#A8D3C9" stroke-opacity=".5"/>
      <text x="244" y="219" text-anchor="middle" fill="#E2F0EC">Local-first</text>
      <rect x="318" y="198" width="196" height="32" rx="16" fill="#E2F0EC" opacity=".12" stroke="#A8D3C9" stroke-opacity=".5"/>
      <text x="416" y="219" text-anchor="middle" fill="#E2F0EC">Bring your own AI key</text>
      <rect x="526" y="198" width="170" height="32" rx="16" fill="#E2F0EC" opacity=".12" stroke="#A8D3C9" stroke-opacity=".5"/>
      <text x="611" y="219" text-anchor="middle" fill="#E2F0EC">Every claim sourced</text>
      <rect x="708" y="198" width="110" height="32" rx="16" fill="#E2F0EC" opacity=".12" stroke="#A8D3C9" stroke-opacity=".5"/>
      <text x="763" y="219" text-anchor="middle" fill="#E2F0EC">ATS-safe</text>
    </g>
  </g>

  <!-- mini resume sheet -->
  <g transform="translate(930 46) rotate(4)">
    <rect width="170" height="220" rx="8" fill="#FFFFFF"/>
    <rect x="18" y="20" width="96" height="11" rx="3" fill="#1A2320"/>
    <rect x="18" y="38" width="130" height="5" rx="2" fill="#CFCCC3"/>
    <rect x="18" y="58" width="56" height="7" rx="2" fill="#0E7466"/>
    <rect x="18" y="68" width="134" height="1.5" fill="#0E7466"/>
    <rect x="18" y="78" width="134" height="5" rx="2" fill="#E2E0D9"/>
    <rect x="18" y="88" width="110" height="5" rx="2" fill="#E2E0D9"/>
    <rect x="18" y="108" width="70" height="7" rx="2" fill="#0E7466"/>
    <rect x="18" y="118" width="134" height="1.5" fill="#0E7466"/>
    <circle cx="22" cy="132" r="2" fill="#47514D"/><rect x="28" y="129" width="120" height="5" rx="2" fill="#E2E0D9"/>
    <circle cx="22" cy="144" r="2" fill="#47514D"/><rect x="28" y="141" width="104" height="5" rx="2" fill="#D7F0E5"/>
    <circle cx="22" cy="156" r="2" fill="#47514D"/><rect x="28" y="153" width="114" height="5" rx="2" fill="#E2E0D9"/>
    <rect x="18" y="176" width="48" height="7" rx="2" fill="#0E7466"/>
    <rect x="18" y="186" width="134" height="1.5" fill="#0E7466"/>
    <rect x="18" y="196" width="122" height="5" rx="2" fill="#E2E0D9"/>
  </g>
  <g transform="translate(1058 214)">
    <circle r="22" fill="#0E7466" stroke="#1A2320" stroke-width="4"/>
    <path d="M-9 0l6 6 12-13" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
